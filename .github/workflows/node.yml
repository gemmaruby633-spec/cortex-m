name: Cortex Neocortical Lifecycle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '45 */4 * * *'

permissions:
  contents: write

jobs:
  run-cortex:
    runs-on: ubuntu-latest
    steps:
      # 1. KÉO CODE BẰNG LINUX SHELL GỐC
      - name: Kéo mã nguồn Cortex
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git .

      # 2. HẠ TẦNG CHUẨN HOÁ MỚI NHẤT
      - name: Thiết lập môi trường Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # 3. VẬN HÀNH ĐỐC CÔNG VỎ NÃO TỰ PHÔI THAI
      - name: Vận hành Cột Vỏ Não Cortex
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: python kernel.py

      # 4. LƯU VẾT TOÀN BỘ CƠ QUAN VỪA TỰ ĐẺ LÊN GIT
      - name: Lưu vết tiến hóa vỏ não lên Git
        run: |
          git config --global user.name "Cortex-Column-Bot"
          git config --global user.email "bot@cortex.neocortex"
          
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          TARGET_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          [ "$TARGET_BRANCH" = "HEAD" ] || [ -z "$TARGET_BRANCH" ] && TARGET_BRANCH="main"

          git fetch origin "$TARGET_BRANCH"
          git reset origin/"$TARGET_BRANCH"
          
          git add -A
          
          if ! git diff --staged --quiet; then
            git commit -m "🧠 [Cortex Neocortex] Nhân bản vỏ não & Kéo đường chéo IQ đi lên #(1+N) [skip ci]"
            git push origin "$TARGET_BRANCH"
          else
            echo "Vỏ não tĩnh lặng, không có biến thiên mới."
          fi
